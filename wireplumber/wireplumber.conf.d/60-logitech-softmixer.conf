# Force software volume for Logitech PRO X 2 so the desktop OSD shows changes
# (migrated from the old wireplumber/main.lua.d/60-logitech-softmixer.lua)
#
# Matches on the exact ALSA card name, so this rule simply never fires on a
# machine without this headset plugged in — safe to keep in a shared config.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.usb-Logitech_PRO_X_2_LIGHTSPEED_0000000000000000-00"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        api.alsa.ignore-dB = false
      }
    }
  }
]
