# Cursor sizes adjusted for 150% scaling (24 * 1.5 = 36)
envd = HYPRCURSOR_SIZE,36
envd = XCURSOR_SIZE,36
envd = QT_CURSOR_SIZE,36

# Qt scaling for 150%
envd = QT_AUTO_SCREEN_SCALE_FACTOR,1
envd = QT_SCALE_FACTOR,1.5
envd = QT_QPA_PLATFORM,wayland

# Additional Qt/KDE settings
envd = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
