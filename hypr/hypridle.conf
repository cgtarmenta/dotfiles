general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = ~/.config/hypr/scripts/ac-power-idle-toggle.sh before-sleep # lock before suspend (unless AC no-idle mode is active)
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display
}

listener {
    timeout = 300                                # 5min
    on-timeout = ~/.config/hypr/scripts/ac-power-idle-toggle.sh lock # lock screen when timeout has passed
}

listener {
    timeout = 330                                # 5.5min
    on-timeout = ~/.config/hypr/scripts/ac-power-idle-toggle.sh dpms-off # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on         # screen on when activity is detected after timeout has fired
}

listener {
    timeout = 1800                               # 30min
    on-timeout = ~/.config/hypr/scripts/ac-power-idle-toggle.sh suspend # suspend pc
}
